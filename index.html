<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1728">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style-v4.css">
  <title>Scorekeeper</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">CARD SCOREKEEPER</div>
        <h1 id="pageTitle">Games</h1>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☀️</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-tab="games" class="nav-item active"><span>🎮</span><b>Games</b></button>
      <button data-tab="players" class="nav-item"><span>👤</span><b>Players</b></button>
      <button data-tab="history" class="nav-item"><span>🕘</span><b>History</b></button>
      <button data-tab="settings" class="nav-item"><span>⚙️</span><b>Settings</b></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app-v4.js"></script>
</body>
</html>
